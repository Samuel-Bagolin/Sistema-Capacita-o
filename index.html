<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Capacitação - Desenvolvimento Profissional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase -->
    <script type="module">
        // Firebase App (the core Firebase SDK) is always required and must be listed first
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { 
            getFirestore,
            collection,
            doc,
            getDoc,
            getDocs,
            setDoc,
            updateDoc,
            deleteDoc,
            arrayUnion,
            arrayRemove,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // SUA CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBrYUi-4NNEfBulesb-TzPc6o69PnUpadI",
            authDomain: "sistema-jornada-colaborador.firebaseapp.com",
            projectId: "sistema-jornada-colaborador",
            storageBucket: "sistema-jornada-colaborador.firebasestorage.app",
            messagingSenderId: "883814857933",
            appId: "1:883814857933:web:85e572d93198f4d36e3d84",
            measurementId: "G-1GT7JJWJ0G"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Configurar provider do Google
        const provider = new GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        provider.setCustomParameters({
            prompt: 'select_account'
        });

        // ========== FUNÇÕES FIREBASE ==========
        
        // Função para verificar configuração do Firebase
        function checkFirebaseConfig() {
            console.log('=== VERIFICAÇÃO FIREBASE ===');
            console.log('Project ID:', firebaseConfig.projectId);
            console.log('Auth Domain:', firebaseConfig.authDomain);
            console.log('API Key:', firebaseConfig.apiKey ? '✓ Configurada' : '✗ Faltando');
            console.log('Domínio atual:', window.location.hostname);
            
            try {
                const currentUser = auth.currentUser;
                console.log('Usuário atual:', currentUser);
                console.log('Auth inicializado:', !!auth);
            } catch (error) {
                console.error('Erro ao acessar auth:', error);
            }
            console.log('=== FIM VERIFICAÇÃO ===');
        }

        // Função de login com Google - Versão Corrigida
        async function loginWithGoogle() {
            try {
                console.log('🔐 Iniciando login com Google...');
                
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                console.log('✅ Usuário autenticado:', {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName
                });
                
                // Verificar se usuário já existe no Firestore
                const userDocRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userDocRef);
                
                if (!userDoc.exists()) {
                    console.log('📝 Criando novo usuário no Firestore...');
                    // Criar novo usuário (padrão como aluno)
                    await setDoc(userDocRef, {
                        nome: user.displayName || 'Usuário',
                        email: user.email,
                        fotoURL: user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=100&q=80',
                        tipo: 'aluno',
                        cargo: 'A definir',
                        setor: 'A definir',
                        progresso: [],
                        telefone: '',
                        dataNascimento: '',
                        dataAdmissao: new Date().toISOString().split('T')[0],
                        gestor: '',
                        criadoEm: new Date(),
                        ultimoAcesso: new Date()
                    });
                    console.log('✅ Novo usuário criado com sucesso');
                } else {
                    console.log('ℹ️ Usuário já existe no Firestore');
                    // Atualizar último acesso
                    await updateDoc(userDocRef, {
                        ultimoAcesso: new Date()
                    });
                }
                
                return user;
            } catch (error) {
                console.error('❌ Erro detalhado no login:', error);
                console.error('Código do erro:', error.code);
                console.error('Mensagem do erro:', error.message);
                
                // Tratamento específico de erros comuns
                let errorMessage = 'Erro ao fazer login. Tente novamente.';
                
                switch (error.code) {
                    case 'auth/popup-blocked':
                        errorMessage = 'Popup bloqueado pelo navegador. Por favor, permita popups para este site.';
                        break;
                    case 'auth/popup-closed-by-user':
                        errorMessage = 'Login cancelado pelo usuário.';
                        break;
                    case 'auth/unauthorized-domain':
                        errorMessage = 'Domínio não autorizado. Verifique as configurações do Firebase Console.';
                        console.error('Domínio atual:', window.location.hostname);
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Login com Google não está habilitado. Verifique as configurações do Firebase.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Erro de rede. Verifique sua conexão com a internet.';
                        break;
                    default:
                        errorMessage = error.message || 'Erro desconhecido ao fazer login.';
                }
                
                throw new Error(errorMessage);
            }
        }

        // Função para obter dados do usuário
        async function getUserData(userId) {
            try {
                const userDoc = await getDoc(doc(db, 'users', userId));
                if (userDoc.exists()) {
                    return { id: userDoc.id, ...userDoc.data() };
                }
                return null;
            } catch (error) {
                console.error('Erro ao buscar dados do usuário:', error);
                return null;
            }
        }

        // Função para atualizar perfil
        async function updateUserProfile(userId, updates) {
            await updateDoc(doc(db, 'users', userId), updates);
        }

        // Função para obter trilhas
        async function getTrilhas() {
            try {
                const querySnapshot = await getDocs(collection(db, 'trilhas'));
                const trilhas = [];
                querySnapshot.forEach((doc) => {
                    trilhas.push({ id: doc.id, ...doc.data() });
                });
                return trilhas;
            } catch (error) {
                console.error('Erro ao buscar trilhas:', error);
                return [];
            }
        }

        // Função para criar trilha (apenas professores)
        async function createTrilha(trilhaData) {
            const newTrilhaRef = doc(collection(db, 'trilhas'));
            await setDoc(newTrilhaRef, {
                ...trilhaData,
                criadoEm: new Date(),
                criadoPor: auth.currentUser.uid
            });
            return newTrilhaRef.id;
        }

        // Função para excluir trilha (apenas professores)
        async function deleteTrilha(trilhaId) {
            await deleteDoc(doc(db, 'trilhas', trilhaId));
        }

        // Função para obter cursos
        async function getCursos() {
            try {
                const querySnapshot = await getDocs(collection(db, 'cursos'));
                const cursos = [];
                querySnapshot.forEach((doc) => {
                    cursos.push({ id: doc.id, ...doc.data() });
                });
                return cursos;
            } catch (error) {
                console.error('Erro ao buscar cursos:', error);
                return [];
            }
        }

        // Função para criar curso (apenas professores)
        async function createCurso(cursoData) {
            const newCursoRef = doc(collection(db, 'cursos'));
            await setDoc(newCursoRef, {
                ...cursoData,
                criadoEm: new Date(),
                criadoPor: auth.currentUser.uid
            });
            return newCursoRef.id;
        }

        // Função para obter alunos (apenas professores)
        async function getAlunos() {
            try {
                const q = query(collection(db, 'users'), where('tipo', '==', 'aluno'));
                const querySnapshot = await getDocs(q);
                const alunos = [];
                querySnapshot.forEach((doc) => {
                    alunos.push({ id: doc.id, ...doc.data() });
                });
                return alunos;
            } catch (error) {
                console.error('Erro ao buscar alunos:', error);
                return [];
            }
        }

        // Função para cadastrar usuário manualmente (apenas professores)
        async function createUser(userData) {
            const newUserRef = doc(collection(db, 'users'));
            await setDoc(newUserRef, {
                ...userData,
                progresso: [],
                criadoEm: new Date(),
                criadoPor: auth.currentUser.uid
            });
            return newUserRef.id;
        }

        // Função para excluir usuário (apenas professores)
        async function deleteUser(userId) {
            await deleteDoc(doc(db, 'users', userId));
        }

        // Função para atualizar progresso do aluno
        async function updateProgresso(userId, cursoId, concluido) {
            if (concluido) {
                await updateDoc(doc(db, 'users', userId), {
                    progresso: arrayUnion(cursoId)
                });
            } else {
                await updateDoc(doc(db, 'users', userId), {
                    progresso: arrayRemove(cursoId)
                });
            }
        }

        // ========== VARIÁVEIS GLOBAIS ==========
        let usuarioAtual = null;
        let tipoUsuario = null;
        let userData = null;

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar configuração do Firebase
            checkFirebaseConfig();
            
            // Elementos da página
            const loginPage = document.getElementById('login-page');
            const alunoDashboard = document.getElementById('aluno-dashboard');
            const professorDashboard = document.getElementById('professor-dashboard');
            const googleLoginBtn = document.getElementById('google-login-btn');
            const cadastrarUsuarioBtn = document.getElementById('cadastrar-usuario-btn');
            const cadastrarUsuarioProfBtn = document.getElementById('cadastrar-usuario-prof-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const profLogoutBtn = document.getElementById('prof-logout-btn');
            const loadingSpinner = document.getElementById('loading-spinner');
            const loginError = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');

            // Elementos do dashboard do aluno
            const userPhoto = document.getElementById('user-photo');
            const userName = document.getElementById('user-name');
            const userRole = document.getElementById('user-role');
            const profileName = document.getElementById('profile-name');
            const profileCargo = document.getElementById('profile-cargo');
            const profileSetor = document.getElementById('profile-setor');
            const profileEmail = document.getElementById('profile-email');
            const trilhaTitulo = document.getElementById('trilha-titulo');
            const trilhaDescricao = document.getElementById('trilha-descricao');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const cursosList = document.getElementById('cursos-list');
            const documentosList = document.getElementById('documentos-list');
            const profileFullname = document.getElementById('profile-fullname');
            const profilePosition = document.getElementById('profile-position');
            const profilePhoto = document.getElementById('profile-photo');
            const profilePhone = document.getElementById('profile-phone');
            const profileBirthdate = document.getElementById('profile-birthdate');
            const profileAdmission = document.getElementById('profile-admission');
            const profileManager = document.getElementById('profile-manager');

            // Abas do aluno
            const tabTrilha = document.getElementById('tab-trilha');
            const tabPerfil = document.getElementById('tab-perfil');
            const conteudoTrilha = document.getElementById('conteudo-trilha');
            const conteudoPerfil = document.getElementById('conteudo-perfil');

            // Abas do professor
            const tabProfTrilhas = document.getElementById('tab-prof-trilhas');
            const tabProfAlunos = document.getElementById('tab-prof-alunos');
            const tabProfConteudos = document.getElementById('tab-prof-conteudos');
            const conteudoProfTrilhas = document.getElementById('conteudo-prof-trilhas');
            const conteudoProfAlunos = document.getElementById('conteudo-prof-alunos');
            const conteudoProfConteudos = document.getElementById('conteudo-prof-conteudos');

            // Botões de edição do perfil
            const editProfileBtn = document.getElementById('edit-profile-btn');
            const editPhotoBtn = document.getElementById('edit-photo-btn');

            // Elementos do dashboard do professor
            const profPhoto = document.getElementById('prof-photo');
            const profName = document.getElementById('prof-name');
            const addTrilhaBtn = document.getElementById('add-trilha-btn');
            const addCursoBtn = document.getElementById('add-curso-btn');
            const addConteudoBtn = document.getElementById('add-conteudo-btn');
            const uploadDocBtn = document.getElementById('upload-doc-btn');
            const trilhaModal = document.getElementById('trilha-modal');
            const cursoModal = document.getElementById('curso-modal');
            const conteudoModal = document.getElementById('conteudo-modal');
            const cadastroUsuarioModal = document.getElementById('cadastro-usuario-modal');
            const editarPerfilModal = document.getElementById('editar-perfil-modal');
            const trilhaForm = document.getElementById('trilha-form');
            const cursoForm = document.getElementById('curso-form');
            const conteudoForm = document.getElementById('conteudo-form');
            const cadastroUsuarioForm = document.getElementById('cadastro-usuario-form');
            const editarPerfilForm = document.getElementById('editar-perfil-form');
            const cancelTrilha = document.getElementById('cancel-trilha');
            const cancelCurso = document.getElementById('cancel-curso');
            const cancelConteudo = document.getElementById('cancel-conteudo');
            const cancelCadastroUsuario = document.getElementById('cancel-cadastro-usuario');
            const cancelEditarPerfil = document.getElementById('cancel-editar-perfil');
            const trilhasProfList = document.getElementById('trilhas-prof-list');
            const alunosTableBody = document.getElementById('alunos-table-body');
            const conteudosTableBody = document.getElementById('conteudos-table-body');
            const totalTrilhas = document.getElementById('total-trilhas');
            const totalCursos = document.getElementById('total-cursos');
            const totalAlunos = document.getElementById('total-alunos');

            // ========== EVENT LISTENERS ==========

            // Login com Google
            googleLoginBtn.addEventListener('click', async () => {
                try {
                    console.log('🎯 Botão de login clicado');
                    loadingSpinner.classList.remove('hidden');
                    loginError.classList.add('hidden');
                    googleLoginBtn.classList.add('login-loading');
                    googleLoginBtn.disabled = true;
                    
                    const user = await loginWithGoogle();
                    userData = await getUserData(user.uid);
                    usuarioAtual = user.uid;
                    tipoUsuario = userData.tipo;
                    
                    console.log('📊 Tipo de usuário:', tipoUsuario);
                    
                    if (tipoUsuario === 'professor') {
                        await loadProfessorDashboard(userData);
                    } else {
                        await loadAlunoDashboard(userData);
                    }
                    
                    loadingSpinner.classList.add('hidden');
                    googleLoginBtn.classList.remove('login-loading');
                    googleLoginBtn.disabled = false;
                } catch (error) {
                    console.error('❌ Erro no processo de login:', error);
                    loadingSpinner.classList.add('hidden');
                    googleLoginBtn.classList.remove('login-loading');
                    googleLoginBtn.disabled = false;
                    loginError.classList.remove('hidden');
                    errorMessage.textContent = error.message || 'Erro ao fazer login. Tente novamente.';
                }
            });

            // Logout
            const handleLogout = () => {
                signOut(auth).then(() => {
                    console.log('👋 Usuário deslogado');
                    usuarioAtual = null;
                    tipoUsuario = null;
                    userData = null;
                    alunoDashboard.classList.add('hidden');
                    professorDashboard.classList.add('hidden');
                    loginPage.classList.remove('hidden');
                }).catch((error) => {
                    console.error('Erro no logout:', error);
                });
            };

            logoutBtn?.addEventListener('click', handleLogout);
            profLogoutBtn?.addEventListener('click', handleLogout);

            // Monitorar estado de autenticação
            onAuthStateChanged(auth, async (user) => {
                console.log('🔄 Estado de autenticação alterado:', user ? 'Usuário logado' : 'Usuário deslogado');
                
                if (user) {
                    console.log('📋 Dados do usuário autenticado:', {
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName
                    });
                    
                    usuarioAtual = user.uid;
                    try {
                        userData = await getUserData(user.uid);
                        if (userData) {
                            tipoUsuario = userData.tipo;
                            console.log('🎓 Tipo de usuário detectado:', tipoUsuario);
                            
                            if (tipoUsuario === 'professor') {
                                await loadProfessorDashboard(userData);
                            } else {
                                await loadAlunoDashboard(userData);
                            }
                        } else {
                            console.error('❌ Dados do usuário não encontrados no Firestore');
                            // Forçar logout se dados não existem
                            await signOut(auth);
                        }
                    } catch (error) {
                        console.error('❌ Erro ao carregar dados do usuário:', error);
                    }
                } else {
                    // Usuário deslogado
                    console.log('🚫 Nenhum usuário autenticado');
                    alunoDashboard.classList.add('hidden');
                    professorDashboard.classList.add('hidden');
                    loginPage.classList.remove('hidden');
                    loadingSpinner.classList.add('hidden');
                }
            });

            // Resto do código permanece igual...
            // [O restante do código JavaScript permanece igual ao anterior]

        });
    </script>
    <style>
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        .login-loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        .login-error {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .login-success {
            background-color: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .hidden {
            display: none;
        }
        
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
        
        .curso-card {
            transition: all 0.3s ease;
        }
        
        .curso-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .trilha-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .active-tab {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Página de Login -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 fade-in">
        <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-graduation-cap text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800">Sistema de Capacitação</h1>
                <p class="text-gray-600 mt-2">Desenvolvimento Profissional Interno</p>
            </div>
            
            <div id="login-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                <span id="error-message"></span>
            </div>
            
            <div id="loading-spinner" class="loading-spinner hidden"></div>
            
            <div class="space-y-4">
                <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Entrar com Google
                </button>
                
                <div class="text-center text-sm text-gray-500">
                    <p>Acesso restrito a colaboradores da empresa</p>
                </div>
                
                <!-- Botão para cadastrar novo usuário -->
                <div class="text-center mt-4">
                    <button id="cadastrar-usuario-btn" class="text-blue-500 hover:text-blue-700 underline">
                        Cadastrar novo usuário
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Resto do HTML permanece igual -->

</body>
</html>
